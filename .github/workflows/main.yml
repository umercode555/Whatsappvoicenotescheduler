name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you also run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VoiceScheduler

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable (if present)
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceScheduler-apk
          path: VoiceScheduler/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
